<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1320" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#be123c" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- 3D Mascot Group scaled & centered -->
  <g transform="translate(7, 5.5) scale(0.50)">
    <!-- 3D Shadow Layer -->
    <g transform="translate(3.5, 4.5)" opacity="0.35">
      <path d="M 22 33 L 5 50 L 26 67" fill="none" stroke="#000000" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 78 33 L 95 50 L 74 67" fill="none" stroke="#000000" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="31" y1="90" x2="69" y2="10" stroke="#000000" stroke-width="7" stroke-linecap="round" />
      <polygon points="22,33 78,33 74,67 26,67" fill="#000000" />
    </g>

    <!-- 3D Mid Extrusion Layer -->
    <g transform="translate(1.8, 2.2)" opacity="0.6">
      <path d="M 22 33 L 5 50 L 26 67" fill="none" stroke="#be123c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 78 33 L 95 50 L 74 67" fill="none" stroke="#be123c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="31" y1="90" x2="69" y2="10" stroke="#be123c" stroke-width="6.5" stroke-linecap="round" />
      <polygon points="22,33 78,33 74,67 26,67" fill="#be123c" />
    </g>

    <!-- Front Mascot Body -->
    <path d="M 22 33 L 5 50 L 26 67" fill="none" stroke="#e11d48" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 78 33 L 95 50 L 74 67" fill="none" stroke="#e11d48" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="31" y1="90" x2="69" y2="10" stroke="#e11d48" stroke-width="6.5" stroke-linecap="round" />
    <polygon points="22,33 78,33 74,67 26,67" fill="#e11d48" />

    <!-- Bright White Pill Eyes -->
    <rect x="39.5" y="44" width="5.5" height="12" rx="2.75" fill="#ffffff" />
    <rect x="55" y="44" width="5.5" height="12" rx="2.75" fill="#ffffff" />
  </g>
</svg>
